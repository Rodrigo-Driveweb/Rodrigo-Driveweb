<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="DriveWeb - Agencia Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04122E"/>
      <stop offset="0.5" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#0FA968"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19D97F"/>
      <stop offset="1" stop-color="#8CF3C2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- dots -->
  <g fill="#ffffff" fill-opacity="0.12">
    <circle cx="120" cy="60" r="3.5"/><circle cx="190" cy="110" r="2.5"/><circle cx="80" cy="150" r="2.5"/>
    <circle cx="60" cy="300" r="3"/><circle cx="150" cy="340" r="2.5"/>
  </g>
  <!-- ondas subtis (fill none!) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
    <path d="M0 350 Q 320 300 640 350 T 1280 350"/>
    <path d="M0 372 Q 320 322 640 372 T 1280 372"/>
  </g>

  <!-- ===== LADO ESQUERDO ===== -->
  <image x="70" y="120" width="120" height="152" xlink:href="data:image/png;base64,"/>
  <text x="215" y="180" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="1">DriveWeb</text>
  <text x="219" y="228" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#EAF3FF">Agencia Digital &#183; Sites que vendem</text>
  <rect x="221" y="248" width="330" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- chips de servico -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#EFFffff">
    <g><rect x="221" y="278" width="104" height="34" rx="17" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25"/><text x="273" y="300" text-anchor="middle" fill="#ffffff">Sites</text></g>
    <g><rect x="333" y="278" width="150" height="34" rx="17" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25"/><text x="408" y="300" text-anchor="middle" fill="#ffffff">Lojas online</text></g>
    <g><rect x="491" y="278" width="86" height="34" rx="17" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25"/><text x="534" y="300" text-anchor="middle" fill="#ffffff">SEO</text></g>
    <g><rect x="585" y="278" width="150" height="34" rx="17" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25"/><text x="660" y="300" text-anchor="middle" fill="#ffffff">Google Ads</text></g>
  </g>
  <text x="223" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.9">PT &#160;&#183;&#160; BR &#160;&#183;&#160; US &#160;&#183;&#160; ES &#160;&#183;&#160; UA</text>

  <!-- ===== MOCKUP BROWSER (direita) ===== -->
  <g transform="translate(858,86)">
    <rect x="0" y="0" width="360" height="228" rx="16" fill="#0B1E3B" stroke="#ffffff" stroke-opacity="0.30"/>
    <rect x="0" y="0" width="360" height="40" rx="16" fill="#12294B"/>
    <rect x="0" y="24" width="360" height="16" fill="#12294B"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F57"/><circle cx="46" cy="20" r="6" fill="#FEBC2E"/><circle cx="68" cy="20" r="6" fill="#28C840"/>
    <rect x="92" y="10" width="240" height="20" rx="10" fill="#0B1E3B"/>
    <text x="104" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9Fc3ff">https://driveweb.pt</text>
    <!-- conteudo -->
    <rect x="24" y="62" width="150" height="16" rx="6" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="24" y="88" width="312" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="24" y="106" width="280" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="24" y="124" width="300" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="24" y="156" width="150" height="42" rx="21" fill="url(#accent)"/>
    <text x="99" y="183" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#04122E">Pedir orcamento</text>
    <rect x="196" y="156" width="140" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3"/>
    <rect x="212" y="170" width="108" height="14" rx="7" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>
